name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Exact toolchain and locked inputs
        run: |
          mkdir -p out
          rustup show
          rustc -Vv | tee out/toolchain.txt
          git rev-parse HEAD > out/source-commit.txt
          test -f Cargo.lock
          cargo fetch --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Tests
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Actual CLI and stdio protocol
        run: |
          cargo build --locked -p rsia
          python3 scripts/smoke.py target/debug/rsia | tee out/smoke.json
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Preserve exact source, not a reformatted working tree
        if: always()
        run: |
          mkdir -p out
          git diff --exit-code
          tar --exclude=.git --exclude=target --exclude=out -czf out/source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: out/
          retention-days: 14
