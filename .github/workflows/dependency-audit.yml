name: Dependency audit
on:
  push:
    branches: [main]
    paths: ['Cargo.lock', 'Cargo.toml', '**/Cargo.toml', 'rust-toolchain.toml', 'LICENSE', 'docs/dependency-register.json', 'docs/dependency-license-inventory.json', 'scripts/check_dependency_register.py', 'scripts/test_check_dependency_register.py', 'scripts/smoke_workspace.py', '.github/workflows/ci.yml', '.github/workflows/dependency-audit.yml', '.github/workflows/offline-build-kit.yml', 'scripts/check_build_inputs.py', 'scripts/test_check_build_inputs.py']
  pull_request:
    paths: ['Cargo.lock', 'Cargo.toml', '**/Cargo.toml', 'rust-toolchain.toml', 'LICENSE', 'docs/dependency-register.json', 'docs/dependency-license-inventory.json', 'scripts/check_dependency_register.py', 'scripts/test_check_dependency_register.py', 'scripts/smoke_workspace.py', '.github/workflows/ci.yml', '.github/workflows/dependency-audit.yml', '.github/workflows/offline-build-kit.yml', 'scripts/check_build_inputs.py', 'scripts/test_check_build_inputs.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require committed lock
        run: |
          test -f Cargo.lock
          test ! -L Cargo.lock
          git cat-file -e HEAD:Cargo.lock
          git diff --exit-code HEAD -- Cargo.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build input contract
        id: build_inputs
        run: python3 scripts/check_build_inputs.py
      - name: Exact Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustc --version --verbose
          cargo --version
          python3 scripts/check_build_inputs.py --check-runtime
      - name: Dependency register inputs
        id: dependency_inputs
        run: python3 scripts/check_dependency_register.py --input-only
      - name: Prepare report
        run: |
          mkdir -p audit-report
          git rev-parse HEAD > audit-report/source-commit.txt
          rustc --version --verbose > audit-report/toolchain.txt
          cargo fetch --locked
          cp Cargo.lock audit-report/Cargo.lock
      - name: Dependency primary evidence
        id: dependency_primary
        run: python3 scripts/check_dependency_register.py
      - name: Install pinned audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit exact lock file
        id: audit
        continue-on-error: true
        run: cargo audit --json > audit-report/rustsec.json
      - name: License metadata inventory
        run: |
          cargo metadata --locked --format-version 1 > audit-report/metadata.json
          python3 - <<'PY'
          import json
          from collections import Counter
          p=json.load(open('audit-report/metadata.json'))['packages']
          rows=[{'name':x['name'],'version':x['version'],'license':x.get('license'),'source':x.get('source'),'license_file':x.get('license_file')} for x in p]
          json.dump({'packages':sorted(rows,key=lambda x:(x['name'],x['version'])),'license_counts':dict(Counter(x['license'] or 'UNDECLARED' for x in rows)),'notice':'Metadata inventory is not legal clearance. The project owner must select the project license before redistribution.'},open('audit-report/licenses.json','w'),ensure_ascii=False,indent=2)
          PY
      - name: Locked inputs remain unchanged
        id: locked_inputs
        if: always() && steps.build_inputs.outcome == 'success'
        run: python3 scripts/check_build_inputs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.build_inputs.outcome == 'success' && steps.locked_inputs.outcome == 'success'
        with:
          name: dependency-audit-${{ github.sha }}
          path: audit-report/
          retention-days: 14
      - name: Vulnerability gate
        if: always()
        env:
          OUTCOME: ${{ steps.audit.outcome }}
        run: test "$OUTCOME" = success
