name: Non-Rust delivery
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'scripts/**', '.github/workflows/**', 'docs/non-rust-delivery-register.json', 'docs/ci-egress-register.json']
  pull_request:
    paths: ['frontend/**', 'scripts/**', '.github/workflows/**', 'docs/non-rust-delivery-register.json', 'docs/ci-egress-register.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONOPTIMIZE: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Non-Rust commands and complete console receipt
        run: python3 -B scripts/non_rust_delivery.py
