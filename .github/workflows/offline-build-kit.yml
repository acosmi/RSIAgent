name: Offline build kit
on:
  push:
    paths: ['.github/workflows/offline-build-kit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require committed lock
        run: |
          test -f Cargo.lock
          test ! -L Cargo.lock
          git cat-file -e HEAD:Cargo.lock
          git diff --exit-code HEAD -- Cargo.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build input contract
        id: build_inputs
        run: python3 scripts/check_build_inputs.py
      - name: Exact Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustc --version --verbose
          cargo --version
          python3 scripts/check_build_inputs.py --check-runtime
      - name: Fetch locked build inputs
        run: |
          cargo fetch --locked
          rustc --version --verbose
      - name: Pack compiler and dependency cache (no credentials)
        shell: bash
        run: |
          mkdir -p kit
          TOOLCHAIN="$(dirname "$(dirname "$(rustup which rustc)")")"
          tar --exclude='./share/doc' --exclude='./share/man' -C "$TOOLCHAIN" -czf kit/toolchain.tar.gz .
          tar -C "$HOME/.cargo" -czf kit/registry.tar.gz registry
          cp Cargo.lock kit/Cargo.lock
          python3 scripts/check_build_inputs.py --check-runtime --json > kit/build-inputs.json
          python3 scripts/check_build_inputs.py --check-runtime --check-kit kit
          rustc -Vv > kit/toolchain.txt
          sha256sum kit/*.tar.gz kit/Cargo.lock kit/build-inputs.json > kit/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-rust-build-kit
          path: kit/
          retention-days: 1
