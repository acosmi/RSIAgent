<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>状态角色视觉核验 · 模拟状态</title><link rel="stylesheet" href="../character.css"><link rel="stylesheet" href="./fixture.css"></head><body><main><h1>状态角色视觉核验</h1><p>仅使用明确的模拟管理作业。此页不连接真实后端，不提供业务通过信用。</p><div class="qa-toolbar"><label>背景<select id="background"><option value="transparent">透明</option><option value="light">浅色</option><option value="dark">深色</option><option value="color">彩色</option><option value="checker">棋盘格</option></select></label><label>模拟事实<select id="state"><option value="disconnected">未连接</option><option value="running">执行中</option><option value="validate">验证中</option><option value="succeeded">已结束</option><option value="cancel">取消中</option><option value="failed">异常</option><option value="stale">来源失效</option></select></label><button id="run-checks" type="button">运行浏览器核验</button><button id="record-view" type="button">记录当前展示</button><button id="restore" type="button" hidden>显示状态角色</button></div><div id="backdrop" class="qa-backdrop qa-transparent"><button type="button" id="behind">点击穿透核验：0</button><div id="character"></div></div><h2>固定帧</h2><p>原镜头、320×340 CSS px、DPR 1、验证姿态、天蓝配色、扫光 0.6 秒。</p><canvas id="fixed-frame" width="320" height="340" aria-label="固定时点角色画面"></canvas><h2>浏览器实测</h2><pre id="report" role="status">尚未执行</pre><pre id="interaction-report">当前展示尚未记录</pre><div id="recycle-host"></div></main><script type="module" src="./fixture.mjs"></script></body></html>
